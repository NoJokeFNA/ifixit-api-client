name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New PEP 440 version (TestPyPI versions cannot be reused)'
        required: true
        default: '0.1.0rc1'
        type: string

permissions:
  contents: read

concurrency:
  group: testpypi-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine packaging
      - name: Validate version and stable source branch
        run: python tools/check_release.py
      - name: Build source distribution and wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_IFIXIT_API_CLIENT: ${{ inputs.version }}
        run: python -m build
      - name: Check metadata and distribution versions
        run: |
          python -m twine check --strict dist/*
          python tools/check_release.py --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testpypi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-dist
          path: dist/
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: Check installed package version and API
        run: python tools/release_smoke.py
      - name: Run unit and local HTTPS integration tests
        run: python -m unittest discover -s tests -v

  publish:
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-dist
          path: dist/
      - name: Check TestPyPI credential is configured
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "$TEST_PYPI_API_TOKEN" ]; then
            echo "::error::Create the repository Actions secret TEST_PYPI_API_TOKEN."
            exit 1
          fi
      - name: Upload the tested distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          skip-existing: false

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-dist
          path: dist/
      - name: Verify published hashes
        run: python tools/verify_testpypi.py
      - name: Install dependencies from regular PyPI
        run: python -m pip install -r requirements.txt
      - name: Install this exact package from TestPyPI
        run: >-
          python -m pip install --no-deps --only-binary=:all:
          --index-url https://test.pypi.org/simple/
          "ifixit-api-client==$RELEASE_VERSION"
      - name: Check installed package version and API
        run: python tools/release_smoke.py
      - name: Run tests against the TestPyPI installation
        run: python -m unittest discover -s tests -v
