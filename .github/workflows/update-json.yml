name: Update Devices JSON to gh-pages

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  update-devices-json:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 'master'
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install tqdm requests

      - name: Copy local ifixit_api_client
        run: |
          if [ -f src/ifixit_api_client.py ]; then
            cp src/ifixit_api_client.py web/
          else
            echo "Local ifixit_api_client.py not found, assuming PyPI package"
          fi

      - name: Run fetch_device_data.py
        working-directory: web
        run: |
          python example_categories.py > example_categories.log 2>&1 || {
            echo "Script failed, check logs for details"
            cat example_categories.log
            exit 1
          }

      - name: Verify output file
        working-directory: web
        run: |
          ls -l devices_with_scores.json || echo "Output file not found"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: script-logs
          path: web/example_categories.log

      - name: Initialize gh-pages branch if it does not exist
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git fetch origin
          if ! git ls-remote --heads origin gh-pages | grep -q "gh-pages"; then
            echo "gh-pages branch does not exist, creating it..."
            mkdir temp_dir
            cd temp_dir
            git init
            echo "# GitHub Pages Branch" > README.md
            git add README.md
            git commit -m "Initialize gh-pages branch"
            git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
            git push -u origin HEAD:gh-pages
            cd ..
            rm -rf temp_dir
            echo "gh-pages branch created"
          else
            echo "gh-pages branch already exists"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: 'gh-pages'
          path: gh-pages
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Copy JSON to gh-pages branch
        run: |
          mkdir -p gh-pages
          cp web/devices_with_scores.json gh-pages/devices_with_scores.json
          cp web/index.html gh-pages/index.html
          cp web/favicon.png gh-pages/favicon.png

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add devices_with_scores.json
          git add index.html
          git add favicon.png
          if git diff --staged --quiet; then
            echo "No changes to commit in gh-pages"
            exit 0
          fi
          git commit -m "change(datasource): update devices_with_scores.json in gh-pages"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}