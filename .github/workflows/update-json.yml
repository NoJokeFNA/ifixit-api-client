name: Update JSON Data

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  push:
    branches: [ master ]

jobs:
  generate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tqdm requests

      - name: Run example_categories.py
        run: |
          cp src/ifixit_api_client.py examples/
          python examples/example_categories.py

      - name: Commit changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add examples/devices_with_scores.json
          git commit -m "change(datasource): update devices_with_scores.json" || echo "change(datasource): no changes to commit"
          git push